seed: 42
num_scenes: 1

rocks:
  directory: assets/rocks
  count: [12, 20]
  diameter: [0.2, 0.8] # horizontal maximum dimension, meters

terrain:
  size: 10.0
  relief: 0.15
  textures: assets/surfaces

camera:
  fov: 60 # horizontal field of view, degrees
  poses: # absolute world XYZ, meters; Z up
    - position: [0, -4, 4]
      look_at: [0, 0, 0]
    - position: [4, 0, 4]
      look_at: [0, 0, 0]
    - position: [0, 4, 4]
      look_at: [0, 0, 0]

lighting:
  random: true

output:
  directory: output/dataset
  resolution: [640, 480]
